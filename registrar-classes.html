<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheduled Classes | Sprachenschule Registrar</title><link rel="icon" type="image/png" href="logo.png"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.registrar-top{background:#102f2a;color:#fff;padding:24px 0}.registrar-top .container{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.registrar-top h1{margin:0;font-size:clamp(1.5rem,3vw,2.2rem)}.registrar-top p{margin:.35rem 0 0;color:#d8e8e2}.class-card{border:1px solid #dfe6e2;border-radius:14px;padding:18px;margin:14px 0;background:#fff}.class-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.class-meta{display:flex;gap:12px;flex-wrap:wrap;color:#58665f;font-size:.92rem}.material-row{padding:10px 12px;border:1px solid #e4e9e6;border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.danger{background:#991b1b!important;color:#fff!important;border-color:#991b1b!important}.status{padding:12px;border-radius:10px;background:#f5f8f6;margin:12px 0;overflow-wrap:anywhere}.class-tools{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.class-card{padding:13px}.class-head{display:block}.class-tools{margin-top:12px}.material-row>*{max-width:100%;overflow-wrap:anywhere}}
</style></head><body>
<header class="registrar-top"><div class="container"><div><h1>Scheduled classes &amp; materials</h1><p>Registrar-only class management</p></div><div class="class-tools"><a class="btn btn-outline" style="color:#fff;border-color:#fff" href="admin.html">← Registrar dashboard</a><button class="btn btn-outline" id="signOut" style="color:#fff;border-color:#fff" type="button">Sign out</button></div></div></header>
<main class="section"><div class="container" style="max-width:1120px"><div id="pageStatus" class="status" role="status">Checking registrar access…</div><div id="classList"></div></div></main>
<script src="config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const statusBox=document.getElementById('pageStatus'),list=document.getElementById('classList');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function isRegistrar(user){const [{data:r,error:re},{data:p,error:pe}]=await Promise.all([sb.from('registrars').select('user_id').eq('user_id',user.id).maybeSingle(),sb.from('profiles').select('role').eq('id',user.id).maybeSingle()]);if(re||pe)throw new Error((re||pe).message);return !!r||['registrar','admin'].includes(p?.role)}
async function loadClasses(){
 statusBox.textContent='Loading scheduled classes…';list.innerHTML='';
 const [{data:classes,error:ce},{data:cohorts,error:coe}]=await Promise.all([sb.rpc('registrar_class_assignment_options'),sb.from('course_cohorts').select('id,name,code,courses(title)')]);
 if(ce||coe){statusBox.textContent='Could not load classes: '+(ce||coe).message;return}
 const rows=classes||[];
 if(!rows.length){statusBox.textContent='No scheduled classes were returned by the school timetable.';return}
 const links=await sb.from('scheduled_classes').select('id,cohort_id,notes,room_name,status,created_by,teacher_id').in('id',rows.map(x=>x.class_id));
 if(links.error){statusBox.textContent='Could not load class details: '+links.error.message;return}
 const byId=new Map((links.data||[]).map(x=>[x.id,x])),cohortMap=new Map((cohorts||[]).map(x=>[x.id,x]));
 const allIds=rows.map(x=>x.class_id);
 const {data:materials, error:me}=await sb.from('class_materials').select('id,class_id,title,material_type,is_hidden,deleted_at,storage_path,created_at').in('class_id',allIds).is('deleted_at',null).order('created_at',{ascending:false});
 if(me){statusBox.textContent='Classes loaded, but materials could not be read: '+me.message;return}
 const materialMap=new Map();(materials||[]).forEach(m=>{if(!materialMap.has(m.class_id))materialMap.set(m.class_id,[]);materialMap.get(m.class_id).push(m)});
 statusBox.textContent=`${rows.length} scheduled class(es). Materials are listed under their associated class.`;
 list.innerHTML=rows.sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).map(c=>{
  const extra=byId.get(c.class_id)||{},co=cohortMap.get(extra.cohort_id),ms=materialMap.get(c.class_id)||[];
  const start=new Date(c.starts_at),end=new Date(start.getTime()+Number(c.duration_minutes||60)*60000);
  return `<article class="class-card" id="class-${esc(c.class_id)}"><div class="class-head"><div><h2 style="margin:0 0 8px">${esc(c.class_title||'Scheduled class')}</h2><div class="class-meta"><span><strong>Starts:</strong> ${start.toLocaleString()}</span><span><strong>Ends:</strong> ${end.toLocaleString()}</span><span><strong>Course/cohort:</strong> ${esc(co?`${co.courses?.title||c.class_level} · ${co.name} (${co.code})`:c.cohort_label||'Legacy / unassigned')}</span><span><strong>Tutor:</strong> ${esc(c.tutor_name||'Unassigned')}</span><span><strong>Status:</strong> ${c.is_live?'LIVE':esc(extra.status||'Scheduled')}</span></div>${extra.notes?`<p>${esc(extra.notes)}</p>`:''}</div><div class="class-tools"><button type="button" class="btn danger" data-delete-class="${esc(c.class_id)}">Permanently delete class</button></div></div><hr><h3>Class materials (${ms.length})</h3>${ms.length?ms.map(m=>`<div class="material-row"><div><strong>${esc(m.title)}</strong><div class="muted">${esc(m.material_type)} · ${m.is_hidden?'Hidden from students':'Visible during class'} · Uploaded ${new Date(m.created_at).toLocaleString()}</div></div><div class="class-tools"><button class="btn btn-outline" type="button" data-delete-material="${esc(m.id)}" data-path="${esc(m.storage_path||'')}">Permanently delete material</button></div></div>`).join(''):'<p class="muted">No uploaded materials for this class.</p>'}<p class="muted" data-class-status="${esc(c.class_id)}" role="status"></p></article>`;
 }).join('');
 list.querySelectorAll('[data-delete-class]').forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.deleteClass;if(!confirm('Permanently delete this scheduled class and all associated class materials? This cannot be undone.'))return;b.disabled=true;const msg=list.querySelector(`[data-class-status="${id}"]`);msg.textContent='Deleting class and associated materials…';const ms=materialMap.get(id)||[];for(const m of ms){if(m.storage_path){const {error:se}=await sb.storage.from('class-materials').remove([m.storage_path]);if(se){msg.textContent='Could not remove stored file '+m.title+': '+se.message+' Class was not deleted.';b.disabled=false;return}}}const {error}=await sb.rpc('registrar_delete_scheduled_class',{p_class_id:id});if(error){msg.textContent='Could not delete class: '+error.message;b.disabled=false;return}await loadClasses()}));
 list.querySelectorAll('[data-delete-material]').forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.deleteMaterial,path=b.dataset.path;if(!confirm('Permanently delete this uploaded material? This cannot be undone.'))return;b.disabled=true;const card=b.closest('.class-card'),msg=card.querySelector('[data-class-status]');if(path){const {error}=await sb.storage.from('class-materials').remove([path]);if(error){msg.textContent='Could not delete stored file: '+error.message;b.disabled=false;return}}const {error}=await sb.from('class_materials').delete().eq('id',id);if(error){msg.textContent='Could not delete material record: '+error.message;b.disabled=false;return}await loadClasses()}));
}
(async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){statusBox.textContent='Please sign in as registrar first on the Registrar Dashboard.';list.innerHTML='<a class="btn btn-primary" href="admin.html">Open registrar sign-in</a>';return}try{if(!await isRegistrar(user)){statusBox.textContent='Access denied. This page is restricted to registrar/admin accounts.';list.innerHTML='';return}await loadClasses()}catch(e){statusBox.textContent='Could not verify registrar access: '+e.message}})();
document.getElementById('signOut').addEventListener('click',async()=>{await sb.auth.signOut({scope:'local'});location.href='admin.html'});
</script></body></html>
