<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprachenschule Class Recording</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b19;color:#f5faf6;font-family:Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:18px;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#172824;border:1px solid #355149;border-radius:12px}
.brand{font-weight:800;letter-spacing:.02em}.count{color:#b8d9c8;font-size:14px}
#attendance{display:flex;gap:8px;flex-wrap:wrap;max-height:68px;overflow:hidden}
.person{background:#294139;border-radius:999px;padding:7px 11px;font-size:13px;white-space:nowrap}
.person small{color:#b9d9ca;margin-left:6px}
#stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,4fr) minmax(190px,1fr);gap:12px}
#focus{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#263632;border-radius:14px;overflow:hidden;position:relative}
#focus video{width:100%;height:100%;object-fit:contain;background:#080d0c}
#focus .presentation-frame{width:100%;height:100%;border:0;background:#fff}#focus .presentation-media{width:100%;height:100%;object-fit:contain;background:#080d0c}#focus .presentation-image{max-width:100%;max-height:100%;object-fit:contain;background:#fff}#focus .presentation-heading{position:absolute;z-index:2;top:0;left:0;right:0;padding:8px 12px;background:#172824dd;color:#fff;font-size:14px;pointer-events:none}
#focus .placeholder{color:#b8d9c8;font-size:22px}
#side{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.tile{position:relative;min-height:110px;flex:1;background:#263632;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile video{width:100%;height:100%;object-fit:cover}
.name{position:absolute;left:8px;bottom:8px;background:#000b;padding:5px 8px;border-radius:6px;font-size:12px}
#status{font-size:11px;color:#9bb8a8;text-align:right}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">Sprachenschule · Live lesson</div><div id="count" class="count">Connecting…</div></header>
<div id="attendance"></div>
<div id="stage"><main id="focus"><div class="placeholder">Connecting to classroom…</div></main><aside id="side"></aside></div>
<div id="status">Private class recording</div>
</div>
<script type="module">
const params=new URLSearchParams(location.search);
const livekitUrl=params.get('url');
const token=params.get('token');
const focus=document.getElementById('focus');
const side=document.getElementById('side');
const attendance=document.getElementById('attendance');
const count=document.getElementById('count');
const status=document.getElementById('status');
let room;
let Track;
function reportDiagnostic(event,detail=''){
 try{fetch('/api/recording-diagnostics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event,detail:String(detail).slice(0,700),room:new URLSearchParams(location.search).get('room')||''}),keepalive:true}).catch(()=>{});}catch{}
}
window.addEventListener('error',e=>reportDiagnostic('window_error',e.message||'Script error'));
window.addEventListener('unhandledrejection',e=>reportDiagnostic('unhandled_rejection',e.reason?.stack||e.reason?.message||String(e.reason)));
reportDiagnostic('page_loaded',location.pathname);
const tiles=new Map();
const label=p=>p.name||p.identity||'Participant';
function role(p){try{const m=JSON.parse(p.metadata||'{}');return ['teacher','tutor'].includes(String(m.role||'').toLowerCase())?'Tutor':'Student'}catch{return 'Student'}}
function drawAttendance(){
 const people=[...room.remoteParticipants.values()];
 count.textContent=people.length+' participant'+(people.length===1?'':'s')+' present';
 attendance.replaceChildren();
 people.forEach(p=>{const el=document.createElement('span');el.className='person';el.textContent=label(p);const r=document.createElement('small');r.textContent=role(p);el.append(r);attendance.append(el)});
}
let activePresentation=null;
function showPresentation(message){
 activePresentation={id:message.id,url:message.url,title:message.title||'Class presentation',type:message.material_type||'note',path:message.storage_path||''};
 focus.replaceChildren();
 const heading=document.createElement('div');heading.className='presentation-heading';heading.textContent=activePresentation.title;focus.append(heading);
 const path=activePresentation.path.toLowerCase().split('?')[0];
 let view;
 if(activePresentation.type==='video'||activePresentation.type==='audio'){
  view=document.createElement(activePresentation.type);view.className='presentation-media';view.src=activePresentation.url;view.autoplay=false;view.controls=false;view.playsInline=true;
  if(activePresentation.type==='audio'){view.style.width='80%';view.style.height='70px';view.style.background='#fff';}
 }else if(/\.(png|jpe?g|gif|webp|svg)$/i.test(path)){
  view=document.createElement('img');view.className='presentation-image';view.src=activePresentation.url;view.alt=activePresentation.title;
 }else{
  view=document.createElement('iframe');view.className='presentation-frame';view.title=activePresentation.title;view.src=activePresentation.url+'#toolbar=0&navpanes=0&view=FitH&page=1';view.setAttribute('allow','autoplay; fullscreen');
 }
 focus.append(view);
 status.textContent='Class presentation: '+activePresentation.title;
 reportDiagnostic('presentation_rendered',activePresentation.type+' '+activePresentation.title);
}
function addTrack(track,publication,participant){
 if(track.kind===Track.Kind.Audio){const el=track.attach();el.autoplay=true;el.style.display='none';document.body.append(el);return}
 if(track.kind!==Track.Kind.Video)return;
 const screen=publication.source===Track.Source.ScreenShare;
 const id=participant.sid+ (screen?':screen':':camera');
 let tile=tiles.get(id);
 if(!tile){
  tile=document.createElement('div');tile.className='tile';
  const name=document.createElement('span');name.className='name';name.textContent=label(participant)+(screen?' · Shared screen':'');tile.append(name);
  if(screen){focus.replaceChildren();tile.style.width='100%';tile.style.height='100%';tile.style.flex='none';focus.append(tile)}
  else{side.append(tile)}
  tiles.set(id,tile);
 }
 const video=track.attach();video.autoplay=true;video.playsInline=true;
 tile.querySelectorAll('video').forEach(v=>v.remove());tile.prepend(video);
}
function removeTrack(track,publication,participant){
 track.detach().forEach(el=>el.remove());
 if(track.kind!==Track.Kind.Video)return;
 const id=participant.sid+(publication.source===Track.Source.ScreenShare?':screen':':camera');
 const tile=tiles.get(id);if(tile){tile.remove();tiles.delete(id)}
 if(![...tiles.keys()].some(k=>k.endsWith(':screen'))){focus.replaceChildren();const p=document.createElement('div');p.className='placeholder';p.textContent='Waiting for tutor screen share';focus.append(p)}
}

try{
 reportDiagnostic('module_import_start');
 const {Room,RoomEvent,Track:LiveKitTrack}=await import('https://esm.sh/livekit-client@2.15.5');
 Track=LiveKitTrack;
 reportDiagnostic('module_import_success');
 room=new Room({adaptiveStream:true,dynacast:false});
 room.on(RoomEvent.TrackSubscribed,addTrack);
room.on(RoomEvent.DataReceived,(data,participant)=>{
 try{
  const message=JSON.parse(new TextDecoder().decode(data));
  let metadata={};try{metadata=JSON.parse(participant?.metadata||'{}')}catch{}
  if(!['teacher','tutor'].includes(String(metadata.role||'').toLowerCase()))return;
  if(message.type==='material-open'&&message.url&&message.id){showPresentation(message);return;}
  if(message.type==='pdf-view'&&message.id===activePresentation?.id){
   const frame=focus.querySelector('iframe.presentation-frame');
   if(frame&&activePresentation?.url)frame.src=activePresentation.url+'#toolbar=0&navpanes=0&view=FitH&page='+Math.max(1,Number(message.page)||1);
   return;
  }
  if(message.type==='material-control'&&message.id===activePresentation?.id){
   const media=focus.querySelector('video.presentation-media,audio.presentation-media');
   if(!media)return;
   if(Number.isFinite(message.time)&&Math.abs(media.currentTime-message.time)>.8)media.currentTime=message.time;
   if(message.action==='play')media.play().catch(()=>{});
   if(message.action==='pause')media.pause();
  }
 }catch(error){reportDiagnostic('presentation_event_error',error?.message||error)}
});
room.on(RoomEvent.TrackUnsubscribed,removeTrack);
room.on(RoomEvent.ParticipantConnected,drawAttendance);
room.on(RoomEvent.ParticipantDisconnected,p=>{for(const key of [...tiles.keys()])if(key.startsWith(p.sid+':')){tiles.get(key)?.remove();tiles.delete(key)}drawAttendance()});
room.on(RoomEvent.Disconnected,()=>{console.log('END_RECORDING')});
 if(!livekitUrl||!token)throw new Error('Missing recorder connection details');
 reportDiagnostic('room_connect_start','LiveKit URL present; token present');
 await room.connect(livekitUrl,token);
 reportDiagnostic('room_connect_success');
 // Signal Egress as soon as the recorder has successfully joined the room.
 // Rendering existing tracks happens afterwards so a display error cannot
 // prevent the required START_RECORDING signal.
 status.textContent='Connected; preparing classroom view';
 console.log('START_RECORDING');
 reportDiagnostic('start_recording_signal_logged');
 for(const p of room.remoteParticipants.values())for(const pub of p.trackPublications.values())if(pub.track)addTrack(pub.track,pub,p);
 drawAttendance();
 status.textContent='Recording connected';
}catch(error){status.textContent='Recording connection failed';console.error(error);reportDiagnostic('startup_error',error?.stack||error?.message||String(error))}
</script>
</body>
</html>
