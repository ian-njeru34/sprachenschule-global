<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning Area | Sprachenschule Global</title><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="container"><nav><a class="logo" href="index.html"><img src="logo.png" alt="Sprachenschule Global"><span>My Learning Area</span></a><div class="links"><a href="shop.html">🛒 Shop</a><button id="logout" class="btn btn-outline">Log out</button></div></nav></div></header><main><section><div class="container"><div id="loading" class="card">Loading your learning area…</div><div id="area" class="hidden"><div class="section-head"><div class="eyebrow">Student dashboard</div><h1 id="welcome"></h1><p id="status" class="muted"></p></div><div class="dashboard"><aside class="side"><strong>My level</strong><div id="level" style="font-size:2rem;font-weight:900;margin:12px 0"></div><a href="shop.html">Buy more materials</a><a href="index.html">Main website</a></aside><section><h2>My learning materials</h2><p class="muted">Only materials assigned to your approved level are shown here.</p><div id="materials" class="materials"></div></section></div></div></div></section></main><footer><div class="container">© <span id="year"></span> Sprachenschule Global</div></footer><script src="config.js"></script><script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='school.html';return}const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error){loading.textContent=error.message;return}loading.classList.add('hidden');area.classList.remove('hidden');welcome.textContent='Welcome, '+(p.full_name||user.email);level.textContent=p.level||'Pending';if(!p.access_approved){status.textContent='Your account is registered but waiting for registrar approval after payment confirmation.';materials.innerHTML='<div class="card"><strong>Access pending</strong><p class="muted">Once the registrar approves your tuition payment, your four-month learning period will begin.</p></div>';return}const end=new Date(p.access_expires_at);if(end<=new Date()){status.textContent='Your four-month learning access has expired. Please contact the school.';materials.innerHTML='<div class="card"><strong>Access expired</strong><p class="muted">Contact the school to renew or enrol again.</p></div>';return}status.textContent='Access active until '+end.toLocaleDateString();const {data:ms}=await sb.from('materials').select('*').eq('level',p.level).eq('published',true).order('created_at',{ascending:false});materials.innerHTML=(ms||[]).map(m=>`<article class="material"><div class="type">${m.media_type}</div><h3>${m.title}</h3><p class="muted">${m.description||''}</p><a class="btn btn-navy" href="${m.preview_url||'#'}" target="_blank" rel="noopener">Open material</a></article>`).join('')||'<div class="card">No materials have been published for your level yet.</div>'}load();logout.onclick=async()=>{await sb.auth.signOut();location.href='school.html'};year.textContent=new Date().getFullYear()</script></body></html>
