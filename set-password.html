
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Your Password | Sprachenschule</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .password-page {
      max-width: 480px;
      margin: 70px auto;
      padding: 30px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,.09);
    }
    .password-page h1 { margin-top: 0; }
    .password-page label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }
    .password-page input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }
    .password-page button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #173f35;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #message { margin-top: 16px; }
    .error { color: #b42318; }
    .success { color: #167044; }
    .help { color: #555; font-size: .94rem; }
  </style>
</head>
<body>
  <main class="password-page">
    <h1>Set your password</h1>
    <p>Welcome to Sprachenschule. Create a secure password for your student account.</p>

    <form id="passwordForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8"
        autocomplete="new-password" required
        placeholder="At least 8 characters">

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="8"
        autocomplete="new-password" required
        placeholder="Enter the password again">

      <button id="submitButton" type="submit">Set password</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p class="help">
      If your invitation has expired or the link does not work,
      contact the registrar and request a new invitation.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script>
    const message = document.getElementById('message');
    const form = document.getElementById('passwordForm');
    const button = document.getElementById('submitButton');

    let supabaseClient;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || '';
    }

    async function initialize() {
      if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
        form.hidden = true;
        showMessage(
          'The authentication configuration could not be loaded. Please contact the school administrator.',
          'error'
        );
        return;
      }

      supabaseClient = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      // Allow Supabase to process the invitation URL and establish a session.
      const { data, error } = await supabaseClient.auth.getSession();

      if (error || !data.session) {
        form.hidden = true;
        showMessage(
          'This invitation link is invalid, expired, or has already been used. Please ask the registrar for a new invitation.',
          'error'
        );
        return;
      }

      const user = data.session.user;
      if (!user || !user.email) {
        form.hidden = true;
        showMessage('Unable to verify the invited account. Please contact the registrar.', 'error');
        return;
      }

      // Remove invitation tokens from the visible URL after the session is established.
      history.replaceState({}, document.title, location.pathname);
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage('Your password must contain at least 8 characters.', 'error');
        return;
      }

      if (password !== confirmation) {
        showMessage('The passwords do not match.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Saving password…';
      showMessage('', '');

      try {
        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
          throw new Error('Your invitation session has expired. Please request a new invitation.');
        }

        const { error } = await supabaseClient.auth.updateUser({ password });

        if (error) throw error;

        showMessage(
          'Your password has been set successfully. You can now sign in using your email and new password.',
          'success'
        );

        form.hidden = true;

        const link = document.createElement('a');
        link.href = '/school.html';
        link.textContent = 'Continue to student login';
        link.style.display = 'inline-block';
        link.style.marginTop = '16px';
        message.appendChild(document.createElement('br'));
        message.appendChild(link);
      } catch (error) {
        showMessage(error.message || 'Unable to set your password. Please try again.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Set password';
      }
    });

    initialize().catch(function () {
      form.hidden = true;
      showMessage(
        'Unable to validate this invitation. Please request a new invitation from the registrar.',
        'error'
      );
    });
  </script>
</body>
</html>
