<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Classroom upgrade | Sprachenschule</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#18212b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(620px,100%);background:#fff;border:1px solid #e2e8ee;border-radius:20px;padding:clamp(26px,5vw,48px);box-shadow:0 18px 60px #172b3d12}
.brand{font-weight:750;letter-spacing:.02em;color:#153b59;font-size:1.1rem}
h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.15;margin:30px 0 14px}
p{line-height:1.65;color:#526170;margin:0 0 16px}
.status{display:inline-flex;align-items:center;gap:9px;border-radius:99px;background:#fff4df;color:#85500b;padding:8px 12px;font-size:.85rem;font-weight:650}
.dot{width:8px;height:8px;border-radius:50%;background:#d58b18}
a{display:inline-block;margin-top:14px;color:#145b8b;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.small{font-size:.9rem;margin-top:26px;color:#778491}
</style>
</head>
<body>
<main>
<div class="brand">Sprachenschule</div>
<h1>We’re upgrading our virtual classroom</h1>
<div class="status"><span class="dot"></span> Classroom temporarily unavailable</div>

<p>Your scheduled lessons and school account remain in place. Please return to your dashboard for updates from the school.</p>
<a href="/dashboard.html">Return to student dashboard</a>
<p class="small">Language · Culture · Opportunity</p>
</main>
</body>
</html>
